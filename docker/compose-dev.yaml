services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: simi
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: simi_development
    ports:
      - "5454:5432"
    volumes:
      - simi_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simi -d simi_development"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - "8025:8025" # Web
      - "1025:1025" # SMTP
    environment:
      - MP_MAX_MESSAGES=500

volumes:
  simi_postgres_data:
